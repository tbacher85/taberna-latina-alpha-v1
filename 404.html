<!DOCTYPE html>
<html>
<head>
    <title>Redirecting to Taberna...</title>
    <script>
        // Handle Supabase auth callback for GitHub Pages
        function handleAuthCallback() {
            const hash = window.location.hash;
            if (hash && hash.includes('access_token')) {
                // This is a Supabase auth callback - redirect to main app WITH the hash
                const mainAppUrl = 'https://tbacher85.github.io/taberna-latina-alpha-v1/';
                window.location.href = mainAppUrl + hash;
            } else {
                // Regular 404 - go to main page
                window.location.href = 'https://tbacher85.github.io/taberna-latina-alpha-v1/';
            }
        }
        
        // Handle both hash and query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const accessToken = urlParams.get('access_token');
        const token = urlParams.get('token'); // Supabase OTP token
        
        if (accessToken) {
            // Token in query parameters (older format)
            window.location.href = 'https://tbacher85.github.io/taberna-latina-alpha-v1/#access_token=' + accessToken;
        } else if (token) {
            // OTP token from magic link - let the app handle it
            window.location.href = 'https://tbacher85.github.io/taberna-latina-alpha-v1/#token=' + token + '&type=magiclink';
        } else {
            // Check hash or redirect to main page
            handleAuthCallback();
        }
    </script>
</head>
<body>
    <p>Redirecting to Taberna Latina...</p>
    <p>If you are not redirected automatically, <a href="https://tbacher85.github.io/taberna-latina-alpha-v1/">click here</a>.</p>
</body>
</html>
